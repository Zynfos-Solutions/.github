<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Zynfos Solutions — Software, cloud and AI engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F4D"/>
      <stop offset="0.6" stop-color="#1E2A78"/>
      <stop offset="1" stop-color="#5B2DD1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#F28C28" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F28C28" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <circle cx="1130" cy="300" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1130" cy="300" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="112" fill="#F6A55B" font-size="20" font-weight="600" letter-spacing="4">SOFTWARE · CLOUD · AI ENGINEERING</text>
    <text x="80" y="188" fill="#FFFFFF" font-size="64" font-weight="800" letter-spacing="-1">Zynfos <tspan fill="#F28C28">Solutions</tspan></text>
    <text x="80" y="240" fill="#C9D3F5" font-size="24">Technology that moves your business forward.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="276" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="164" y="300" fill="#FFFFFF" text-anchor="middle">Chennai · India</text>
      <rect x="260" y="276" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="344" y="300" fill="#FFFFFF" text-anchor="middle">MSME certified</text>
      <rect x="440" y="276" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="524" y="300" fill="#FFFFFF" text-anchor="middle">4 live products</text>
    </g>
  </g>
</svg>
