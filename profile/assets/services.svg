<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#F28C28"/><stop offset=".5" stop-color="#F6A55B"/><stop offset="1" stop-color="#F28C28"/></linearGradient>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .n{font-size:13px;letter-spacing:3px;fill:#F28C28}
      .h{font-size:22px;font-weight:600;fill:#f5f5f7}
      .p{font-size:14px;fill:#9AA6D8}
      .s{font-size:12px;letter-spacing:1px;fill:#F6A55B}
      .c{fill:#0B1F4D;stroke:#ffffff;stroke-opacity:.08}
      .card{opacity:0;animation:in .8s ease forwards}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <g class="t">
    <g class="card" style="animation-delay:.0s"><rect x="1" y="1" width="386" height="208" rx="14" class="c"/><text x="32" y="48" class="n">01</text><text x="32" y="92" class="h">Software &amp; Web</text><text x="32" y="124" class="p">Custom platforms, dashboards</text><text x="32" y="146" class="p">and business websites.</text><text x="32" y="184" class="s">NEXT.JS · NODE · DJANGO</text></g>
    <g class="card" style="animation-delay:.15s"><rect x="407" y="1" width="386" height="208" rx="14" class="c"/><text x="438" y="48" class="n">02</text><text x="438" y="92" class="h">Mobile Apps</text><text x="438" y="124" class="p">iOS and Android from</text><text x="438" y="146" class="p">one shared codebase.</text><text x="438" y="184" class="s">FLUTTER · REACT NATIVE</text></g>
    <g class="card" style="animation-delay:.3s"><rect x="813" y="1" width="386" height="208" rx="14" class="c"/><text x="844" y="48" class="n">03</text><text x="844" y="92" class="h">AI &amp; Automation</text><text x="844" y="124" class="p">Practical AI and workflows,</text><text x="844" y="146" class="p">introduced where they pay off.</text><text x="844" y="184" class="s">LLMS · PYTHON · N8N</text></g>
    <g class="card" style="animation-delay:.45s"><rect x="1" y="229" width="386" height="208" rx="14" class="c"/><text x="32" y="276" class="n">04</text><text x="32" y="320" class="h">Cloud Infrastructure</text><text x="32" y="352" class="p">CI/CD, monitoring and</text><text x="32" y="374" class="p">zero-downtime releases.</text><text x="32" y="412" class="s">AWS · DOCKER · NGINX</text></g>
    <g class="card" style="animation-delay:.6s"><rect x="407" y="229" width="386" height="208" rx="14" class="c"/><text x="438" y="276" class="n">05</text><text x="438" y="320" class="h">UI / UX Design</text><text x="438" y="352" class="p">Clickable prototypes before</text><text x="438" y="374" class="p">a single line of code.</text><text x="438" y="412" class="s">FIGMA · DESIGN SYSTEMS</text></g>
    <g class="card" style="animation-delay:.75s"><rect x="813" y="229" width="386" height="208" rx="14" class="c"/><text x="844" y="276" class="n">06</text><text x="844" y="320" class="h">IT Consulting</text><text x="844" y="352" class="p">Architecture reviews, audits</text><text x="844" y="374" class="p">and technical roadmaps.</text><text x="844" y="412" class="s">STRATEGY · ROADMAPS</text></g>
  </g>
</svg>
